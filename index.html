<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover abilita le safe-area (notch / home indicator) su iPhone.
         NON usiamo user-scalable=no: lo zoom al focus si evita col font-size 16px sugli input. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1206" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lupo Solitario" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Lupo Solitario</title>
    <!-- Splash inline: si dipinge immediatamente col primo paint dell'HTML (prima
         che il bundle JS venga scaricato/eseguito), coprendo il gap di avvio anche
         da PWA installata su iOS. Rimosso da main.tsx quando l'app è montata.
         Stessi colori del tema (background_color del manifest) → transizione senza
         sfarfallii. Nessun testo tradotto: solo il wordmark del brand. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1a1206;
        color: #c9a24c;
        font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        transition: opacity 0.4s ease;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 14px rgba(201, 162, 76, 0.35));
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #splash .splash-word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Lupo Solitario">
      <svg class="splash-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 8 L56 32 L32 56 L8 32 Z" fill="none" stroke="#c9a24c" stroke-width="3.5" />
        <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#c9a24c" />
      </svg>
      <div class="splash-word">Lupo Solitario</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
